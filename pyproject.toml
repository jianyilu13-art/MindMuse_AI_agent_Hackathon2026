[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-agent"
version = "0.1.0"
description = "An AI-assisted shopping agent"
requires-python = ">=3.10"
dependencies = [
    "groq>=1.0.0",
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
addopts = "-p no:launch_testing"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
